<text x="60" y="610" font-size="13" fill="#8a897f">EAPS010·EBPS010 = 코스모로보틱스(주) — 의료기기안심책방 허가번호 조회로 확인(2026-09-11). 초기(2007–17)는 수입 위주, 2021년 이후 신규 11건 중 10건이 국산.</text>
