<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="AppleSDGothicNeo-Regular, 'Apple SD Gothic Neo', sans-serif">
<rect width="1280" height="720" fill="#fcfcfb"/>
<text x="60" y="52" font-size="30" font-weight="bold" fill="#0b0b0b">누가 선수인가 — 업체별 허가 건수</text>
<text x="60" y="84" font-size="17" fill="#52514e">로봇보조정형용운동장치(A67080) 32건의 업체 지도 · 안심책방 전수 대조로 업체 확정</text>
<text x="60" y="122" font-size="15" fill="#52514e">최다는 <tspan font-weight="bold" fill="#0b0b0b">큐렉소(6건)</tspan> · 수입 유통은 정우무역(Hocoma)·하스피 축 · 대기업(현대차)은 2025년 진입</text>
<rect x="900" y="140" width="14" height="14" rx="3" fill="#2a78d6"/><text x="920" y="152" font-size="14" fill="#0b0b0b">제조(국산) 허가</text>
<rect x="1050" y="140" width="14" height="14" rx="3" fill="#eb6834"/><text x="1070" y="152" font-size="14" fill="#0b0b0b">수입 허가</text>
<text x="416" y="212.0" font-size="15" fill="#0b0b0b" text-anchor="end">큐렉소 (Morning Walk)</text>
<rect x="430" y="190" width="414.66666666666663" height="34" rx="4" fill="#2a78d6"/>
<rect x="846.6666666666666" y="190" width="81.33333333333333" height="34" rx="4" fill="#eb6834"/>
<text x="940.0" y="212.0" font-size="15" font-weight="bold" fill="#52514e">6건</text>
<text x="416" y="270.0" font-size="15" fill="#0b0b0b" text-anchor="end">앞썬코퍼레이션 (Reo·EsoGLOVE 수입 등)</text>
<rect x="430" y="248" width="81.33333333333333" height="34" rx="4" fill="#2a78d6"/>
<rect x="513.3333333333334" y="248" width="248.0" height="34" rx="4" fill="#eb6834"/>
<text x="773.3333333333333" y="270.0" font-size="15" font-weight="bold" fill="#52514e">4건</text>
<text x="416" y="328.0" font-size="15" fill="#0b0b0b" text-anchor="end">피앤에스로보틱스 (Walkbot)</text>
<rect x="430" y="306" width="331.3333333333333" height="34" rx="4" fill="#2a78d6"/>
<text x="773.3333333333333" y="328.0" font-size="15" font-weight="bold" fill="#52514e">4건</text>
<text x="416" y="386.0" font-size="15" fill="#0b0b0b" text-anchor="end">정우무역 (Hocoma 수입 — Lokomat 등)</text>
<rect x="430" y="364" width="248.0" height="34" rx="4" fill="#eb6834"/>
<text x="690.0" y="386.0" font-size="15" font-weight="bold" fill="#52514e">3건</text>
<text x="416" y="444.0" font-size="15" fill="#0b0b0b" text-anchor="end">코스모로보틱스 (EA2 Pro·Bambini)</text>
<rect x="430" y="422" width="164.66666666666666" height="34" rx="4" fill="#2a78d6"/>
<text x="606.6666666666666" y="444.0" font-size="15" font-weight="bold" fill="#52514e">2건</text>
<text x="416" y="502.0" font-size="15" fill="#0b0b0b" text-anchor="end">엔젤로보틱스 (엔젤렉스 M20·L30)</text>
<rect x="430" y="480" width="164.66666666666666" height="34" rx="4" fill="#2a78d6"/>
<text x="606.6666666666666" y="502.0" font-size="15" font-weight="bold" fill="#52514e">2건</text>
<text x="416" y="560.0" font-size="15" fill="#0b0b0b" text-anchor="end">하스피 (InMotion 수입)</text>
<rect x="430" y="538" width="164.66666666666666" height="34" rx="4" fill="#eb6834"/>
<text x="606.6666666666666" y="560.0" font-size="15" font-weight="bold" fill="#52514e">2건</text>
<text x="416" y="618.0" font-size="15" fill="#0b0b0b" text-anchor="end">기타 9개사 (현대차·헥사·휴카 등 각 1건)</text>
<rect x="430" y="596" width="498.0" height="34" rx="4" fill="#2a78d6"/>
<rect x="930.0" y="596" width="248.0" height="34" rx="4" fill="#eb6834"/>
<text x="1190.0" y="618.0" font-size="15" font-weight="bold" fill="#52514e">9건</text>
<line x1="430" y1="176" x2="430" y2="644" stroke="#d8d7d0" stroke-width="1.5"/>
<text x="60" y="682" font-size="13" fill="#8a897f">출처: 의료기기안심책방 품목검색 전수(2026-09-13 조회) · 앞썬/앞썬코퍼레이션은 동일 계열로 합산 · WalkAI LAB · 김지민</text>
</svg>