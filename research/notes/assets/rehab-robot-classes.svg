<text x="60" y="660" font-size="13" fill="#8a897f">건수는 키워드 수집(2,504건) 기반 분류 집계 — 수동식·전동식은 신고 품목 포함, 로봇보조(A67080)만 전 건 3등급 허가.</text>
<text x="60" y="684" font-size="13" fill="#8a897f">출처: 식품의약품안전처 의료기기 품목허가 정보 (공공데이터포털 OpenAPI) · WalkAI LAB · 김지민</text>
