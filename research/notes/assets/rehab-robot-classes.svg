<text x="60" y="52" font-size="30" font-weight="bold" fill="#0b0b0b">재활로봇은 아직 니치다 — 이웃 품목과의 규모 비교</text>
<text x="60" y="84" font-size="17" fill="#52514e">정형용 운동장치 계열 + 보행분석계 국내 허가·신고 건수 (품목명 기준, 2026-09 수집)</text>
<text x="60" y="122" font-size="15" fill="#52514e">전통 재활기구(수동식 511건) 대비 로봇보조는 <tspan font-weight="bold" fill="#2a78d6">32건</tspan> — 그러나 유일하게 전 건이 3등급 '허가'인 고규제·고부가 품목</text>
